start_server:
  name: Start server
  description: Start a stopped DCS server. Control must be enabled in integration options.
  fields:
    server_name: &server_name
      name: Server
      required: true
      selector:
        text:
    entry_id: &entry_id
      name: Integration entry ID
      required: false
      selector:
        text:
stop_server:
  name: Stop server
  description: Stop a running DCS server.
  fields:
    server_name: *server_name
    entry_id: *entry_id
restart_server:
  name: Restart server
  description: Restart a DCS server.
  fields:
    server_name: *server_name
    entry_id: *entry_id
pause_mission:
  name: Pause mission
  description: Pause the current mission.
  fields:
    server_name: *server_name
    entry_id: *entry_id
resume_mission:
  name: Resume mission
  description: Resume the current mission.
  fields:
    server_name: *server_name
    entry_id: *entry_id
restart_mission:
  name: Restart mission
  description: Restart the current mission.
  fields:
    server_name: *server_name
    entry_id: *entry_id
load_mission:
  name: Load mission
  description: Load one of the missions available to the selected DCS server.
  fields:
    server_name: *server_name
    mission_name:
      name: Mission
      required: true
      selector:
        text:
    entry_id: *entry_id
kick_player:
  name: Kick player
  description: Kick an active player from the selected DCS server through the companion moderation bridge.
  fields:
    server_name: *server_name
    player_name: &player_name
      name: Player
      required: true
      selector:
        text:
    reason: &reason
      name: Reason
      required: false
      selector:
        text:
    entry_id: *entry_id
ban_player:
  name: Ban player
  description: Persistently ban a known DCS player. Set days to 0 for a permanent ban.
  fields:
    player_name: *player_name
    reason: *reason
    days:
      name: Days
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3650
          mode: box
    entry_id: *entry_id
unban_player:
  name: Unban player
  description: Remove an active persistent ban for a known DCS player.
  fields:
    player_name: *player_name
    reason: *reason
    entry_id: *entry_id
